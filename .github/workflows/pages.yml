name: Deploy to GitHub Pages
on:
  push:
    branches: ["main"]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: "mood-player-pages"
  cancel-in-progress: false
jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Stamp build version (cache bust)
        run: |
          BUILD_ID="${GITHUB_RUN_NUMBER}-${GITHUB_SHA:0:7}"
          BUILD_TIME="$(date -u +"%Y-%m-%dT%H:%M:%SZ")"
          sed -i "s/content=\"local\"/content=\"${BUILD_ID}\"/g" index.html
          sed -i "s/build: local/build: ${BUILD_ID} @ ${BUILD_TIME}/g" index.html
          mkdir -p _site
          cp index.html _site/index.html
          cp .nojekyll _site/.nojekyll
          printf '{"build":"%s","time":"%s","sha":"%s"}\n' \
            "${BUILD_ID}" "${BUILD_TIME}" "${GITHUB_SHA}" > _site/version.json
          echo "Deployed build ${BUILD_ID} at ${BUILD_TIME}"

      - name: Setup Pages
        uses: actions/configure-pages@v4

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: '_site'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
