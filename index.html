<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
  <meta http-equiv="Pragma" content="no-cache">
  <meta http-equiv="Expires" content="0">
  <meta name="build-id" content="local">
  <title>mood player</title>
  <!-- build: local -->
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg: #0a0a0a;
      --fg: #6a6a6a;
      --fg-dim: #3a3a3a;
      --fg-bright: #9a9a9a;
      --accent: #4a4a4a;
      --line: rgba(120, 120, 120, 0.25);
      --glow: rgba(80, 80, 80, 0.15);
    }

    html, body {
      height: 100%;
      overflow: hidden;
      background: var(--bg);
      color: var(--fg);
      font-family: "Segoe UI", system-ui, -apple-system, sans-serif;
      font-weight: 300;
      letter-spacing: 0.08em;
    }

    /* grain + fog layers */
    .atmosphere {
      position: fixed;
      inset: 0;
      pointer-events: none;
      z-index: 0;
    }

    .grain {
      position: absolute;
      inset: -50%;
      opacity: 0.04;
      background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.85' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)'/%3E%3C/svg%3E");
      animation: grain-drift 8s steps(10) infinite;
    }

    .fog {
      position: absolute;
      inset: 0;
      background:
        radial-gradient(ellipse 80% 60% at 30% 40%, rgba(20, 20, 25, 0.6) 0%, transparent 70%),
        radial-gradient(ellipse 70% 50% at 70% 60%, rgba(15, 15, 20, 0.5) 0%, transparent 65%);
      animation: fog-drift 28s ease-in-out infinite alternate;
    }

    .fog-2 {
      position: absolute;
      inset: 0;
      background: radial-gradient(ellipse 90% 70% at 50% 50%, rgba(12, 12, 16, 0.4) 0%, transparent 60%);
      animation: fog-drift-2 35s ease-in-out infinite alternate;
    }

    @keyframes grain-drift {
      0%, 100% { transform: translate(0, 0); }
      10% { transform: translate(-2%, -3%); }
      30% { transform: translate(3%, 1%); }
      50% { transform: translate(-1%, 4%); }
      70% { transform: translate(4%, -2%); }
      90% { transform: translate(-3%, 2%); }
    }

    @keyframes fog-drift {
      0% { transform: translate(0, 0) scale(1); opacity: 0.7; }
      100% { transform: translate(4%, -3%) scale(1.08); opacity: 1; }
    }

    @keyframes fog-drift-2 {
      0% { transform: translate(0, 0) scale(1.05); }
      100% { transform: translate(-5%, 4%) scale(1); }
    }

    #viz {
      position: fixed;
      inset: 0;
      z-index: 1;
      pointer-events: none;
    }

    .ui {
      position: relative;
      z-index: 2;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      padding: 2rem;
    }

    .dropzone {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      width: min(420px, 90vw);
      min-height: 140px;
      border: 1px solid var(--line);
      border-radius: 2px;
      background: rgba(10, 10, 10, 0.6);
      backdrop-filter: blur(4px);
      cursor: pointer;
      transition: border-color 0.4s ease, box-shadow 0.4s ease;
      text-align: center;
      padding: 2rem 1.5rem;
    }

    .dropzone:hover,
    .dropzone.dragover {
      border-color: rgba(140, 140, 140, 0.4);
      box-shadow: 0 0 30px var(--glow);
    }

    .dropzone.hidden { display: none; }

    .dropzone-label {
      font-size: 0.75rem;
      text-transform: lowercase;
      color: var(--fg);
      line-height: 1.8;
    }

    .dropzone-label span {
      display: block;
      font-size: 0.6rem;
      color: var(--fg-dim);
      margin-top: 0.5rem;
      letter-spacing: 0.12em;
    }

    #file-input { display: none; }

    .player {
      display: none;
      flex-direction: column;
      align-items: center;
      gap: 1.5rem;
      width: min(420px, 90vw);
      margin-top: 2rem;
      padding: 1.25rem 1.5rem;
      border: 1px solid rgba(120, 120, 120, 0.12);
      border-radius: 2px;
      background: rgba(10, 10, 10, 0.72);
      backdrop-filter: blur(8px);
    }

    .player.visible { display: flex; }

    .track-name {
      font-size: 0.7rem;
      color: var(--fg-bright);
      text-transform: lowercase;
      max-width: 100%;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
      text-align: center;
    }

    .controls {
      display: flex;
      align-items: center;
      gap: 1.2rem;
      width: 100%;
    }

    .btn-play {
      flex-shrink: 0;
      width: 36px;
      height: 36px;
      border: 1px solid var(--line);
      border-radius: 50%;
      background: transparent;
      color: var(--fg-bright);
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: border-color 0.3s, box-shadow 0.3s;
      font-size: 0.65rem;
      letter-spacing: 0;
    }

    .btn-play:hover {
      border-color: rgba(140, 140, 140, 0.5);
      box-shadow: 0 0 20px var(--glow);
    }

    .btn-play svg {
      width: 10px;
      height: 10px;
      fill: currentColor;
    }

    .timeline {
      flex: 1;
      position: relative;
      height: 2px;
      background: var(--fg-dim);
      cursor: pointer;
      border-radius: 1px;
    }

    .timeline-fill {
      position: absolute;
      left: 0;
      top: 0;
      height: 100%;
      width: 0%;
      background: var(--fg-bright);
      border-radius: 1px;
      pointer-events: none;
      transition: width 0.05s linear;
    }

    .timeline-thumb {
      position: absolute;
      top: 50%;
      left: 0%;
      width: 8px;
      height: 8px;
      border: 1px solid var(--fg-bright);
      border-radius: 50%;
      background: var(--bg);
      transform: translate(-50%, -50%);
      pointer-events: none;
      opacity: 0;
      transition: opacity 0.2s;
    }

    .timeline:hover .timeline-thumb { opacity: 1; }

    .time-labels {
      display: flex;
      justify-content: space-between;
      width: 100%;
      font-size: 0.55rem;
      color: var(--fg-dim);
      letter-spacing: 0.05em;
    }

    .error-toast {
      position: fixed;
      bottom: 2rem;
      left: 50%;
      transform: translateX(-50%) translateY(120%);
      z-index: 10;
      padding: 0.75rem 1.25rem;
      border: 1px solid rgba(120, 60, 60, 0.4);
      background: rgba(20, 10, 10, 0.9);
      color: #886666;
      font-size: 0.65rem;
      letter-spacing: 0.06em;
      transition: transform 0.4s ease;
      max-width: 90vw;
      text-align: center;
    }

    .error-toast.show { transform: translateX(-50%) translateY(0); }

    .change-track {
      margin-top: 0.5rem;
      background: none;
      border: none;
      color: var(--fg-dim);
      font-size: 0.55rem;
      cursor: pointer;
      letter-spacing: 0.1em;
      text-transform: lowercase;
      transition: color 0.3s;
    }

    .change-track:hover { color: var(--fg); }

    .btn-back {
      display: none;
      position: fixed;
      top: 1.25rem;
      left: 1.25rem;
      z-index: 3;
      padding: 0.55rem 1rem;
      border: 1px solid var(--line);
      border-radius: 2px;
      background: rgba(10, 10, 10, 0.75);
      backdrop-filter: blur(6px);
      color: var(--fg-bright);
      font-family: inherit;
      font-size: 0.6rem;
      font-weight: 300;
      letter-spacing: 0.14em;
      text-transform: lowercase;
      cursor: pointer;
      transition: border-color 0.3s, box-shadow 0.3s, color 0.3s;
    }

    .btn-back.visible { display: block; }

    .btn-back:hover {
      border-color: rgba(160, 160, 160, 0.45);
      box-shadow: 0 0 24px var(--glow);
      color: #d0d0d0;
    }
  </style>
</head>
<body>
  <div class="atmosphere" aria-hidden="true">
    <div class="grain"></div>
    <div class="fog"></div>
    <div class="fog-2"></div>
  </div>

  <canvas id="viz"></canvas>

  <button class="btn-back" id="btn-back" type="button">← возврат</button>

  <div class="ui">
    <label class="dropzone" id="dropzone" for="file-input">
      <p class="dropzone-label">
        перетащи сюда свой бит или выбери файл
        <span>mp3 · wav · ogg · flac · m4a</span>
      </p>
    </label>
    <input type="file" id="file-input" accept="audio/*">

    <div class="player" id="player">
      <p class="track-name" id="track-name">—</p>
      <div class="controls">
        <button class="btn-play" id="btn-play" aria-label="Play">
          <svg id="icon-play" viewBox="0 0 24 24"><polygon points="8,5 19,12 8,19"/></svg>
          <svg id="icon-pause" viewBox="0 0 24 24" style="display:none"><rect x="6" y="5" width="4" height="14"/><rect x="14" y="5" width="4" height="14"/></svg>
        </button>
        <div class="timeline" id="timeline">
          <div class="timeline-fill" id="timeline-fill"></div>
          <div class="timeline-thumb" id="timeline-thumb"></div>
        </div>
      </div>
      <div class="time-labels">
        <span id="time-current">0:00</span>
        <span id="time-duration">0:00</span>
      </div>
    </div>
  </div>

  <div class="error-toast" id="error-toast"></div>

  <script>
    (function () {
      const dropzone = document.getElementById('dropzone');
      const fileInput = document.getElementById('file-input');
      const player = document.getElementById('player');
      const trackName = document.getElementById('track-name');
      const btnPlay = document.getElementById('btn-play');
      const iconPlay = document.getElementById('icon-play');
      const iconPause = document.getElementById('icon-pause');
      const timeline = document.getElementById('timeline');
      const timelineFill = document.getElementById('timeline-fill');
      const timelineThumb = document.getElementById('timeline-thumb');
      const timeCurrent = document.getElementById('time-current');
      const timeDuration = document.getElementById('time-duration');
      const changeTrack = document.getElementById('btn-back');
      const errorToast = document.getElementById('error-toast');
      const canvas = document.getElementById('viz');
      const ctx = canvas.getContext('2d');

      let audioContext = null;
      let analyser = null;
      let sourceNode = null;
      let audioElement = null;
      let objectUrl = null;
      let animationId = null;
      let isPlaying = false;
      let isSeeking = false;
      let kickEnvelope = 0;
      let bassAvg = 0;
      let lastKickTime = 0;
      let freqData = null;
      let spectrumBars = null;
      const SPECTRUM_BARS = 96;
      let errorTimeout = null;

      function showError(msg) {
        errorToast.textContent = msg;
        errorToast.classList.add('show');
        clearTimeout(errorTimeout);
        errorTimeout = setTimeout(() => errorToast.classList.remove('show'), 4000);
      }

      function formatTime(sec) {
        if (!isFinite(sec) || sec < 0) return '0:00';
        const m = Math.floor(sec / 60);
        const s = Math.floor(sec % 60);
        return m + ':' + String(s).padStart(2, '0');
      }

      function resizeCanvas() {
        const dpr = window.devicePixelRatio || 1;
        canvas.width = window.innerWidth * dpr;
        canvas.height = window.innerHeight * dpr;
        canvas.style.width = window.innerWidth + 'px';
        canvas.style.height = window.innerHeight + 'px';
        ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
      }

      window.addEventListener('resize', resizeCanvas);
      resizeCanvas();

      async function initAudioContext() {
        if (audioContext) return audioContext;
        const Ctx = window.AudioContext || window.webkitAudioContext;
        if (!Ctx) {
          showError('браузер не поддерживает Web Audio API');
          throw new Error('No AudioContext');
        }
        audioContext = new Ctx();
        if (audioContext.state === 'suspended') {
          try {
            await audioContext.resume();
          } catch (e) {
            showError('нажми play — браузер блокирует аудио до взаимодействия');
          }
        }
        return audioContext;
      }

      function setupAnalyser() {
        analyser = audioContext.createAnalyser();
        analyser.fftSize = 2048;
        analyser.smoothingTimeConstant = 0.42;
        analyser.minDecibels = -85;
        analyser.maxDecibels = -8;
        freqData = new Uint8Array(analyser.frequencyBinCount);
        spectrumBars = new Float32Array(SPECTRUM_BARS);
      }

      function connectSource() {
        if (sourceNode) {
          try { sourceNode.disconnect(); } catch (_) {}
        }
        sourceNode = audioContext.createMediaElementSource(audioElement);
        sourceNode.connect(analyser);
        analyser.connect(audioContext.destination);
      }

      function getBassLevel() {
        if (!analyser) return 0;
        analyser.getByteFrequencyData(freqData);
        const bassBins = Math.max(4, Math.floor(freqData.length * 0.06));
        let sum = 0;
        for (let i = 0; i < bassBins; i++) sum += freqData[i];
        return sum / (bassBins * 255);
      }

      function getSpectrumBars(kick) {
        if (!analyser) return spectrumBars;

        analyser.getByteFrequencyData(freqData);
        const binCount = freqData.length;

        for (let i = 0; i < SPECTRUM_BARS; i++) {
          const t0 = Math.pow(i / SPECTRUM_BARS, 1.85);
          const t1 = Math.pow((i + 1) / SPECTRUM_BARS, 1.85);
          const start = Math.floor(t0 * binCount);
          const end = Math.max(start + 1, Math.floor(t1 * binCount));

          let peak = 0;
          for (let b = start; b < end; b++) peak = Math.max(peak, freqData[b] / 255);

          const bassZone = i < SPECTRUM_BARS * 0.12;
          const lowMidZone = i < SPECTRUM_BARS * 0.28;

          if (bassZone) peak *= 2.2 + kick * 3.5;
          else if (lowMidZone) peak *= 1.15 + kick * 0.35;

          const target = Math.min(1, peak);
          const rise = bassZone ? 0.72 : 0.5;
          const fall = bassZone ? 0.18 : 0.14;
          const speed = target > spectrumBars[i] ? rise : fall;
          spectrumBars[i] += (target - spectrumBars[i]) * speed;
        }

        return spectrumBars;
      }

      function drawFrequencyWaveform(cx, cy, w, h, kick) {
        if (!analyser || !isPlaying) return;

        const bars = getSpectrumBars(kick);
        const waveW = w * 0.72;
        const maxH = Math.min(w, h) * (0.045 + kick * 0.1);
        const startX = cx - waveW / 2;
        const step = waveW / (SPECTRUM_BARS - 1);

        ctx.save();

        function curveY(i, sign) {
          return cy - sign * bars[i] * maxH;
        }

        ctx.beginPath();
        ctx.moveTo(startX, cy);
        for (let i = 0; i < SPECTRUM_BARS; i++) {
          ctx.lineTo(startX + i * step, curveY(i, 1));
        }
        ctx.lineTo(startX + waveW, cy);
        ctx.closePath();

        ctx.beginPath();
        ctx.moveTo(startX, cy);
        for (let i = 0; i < SPECTRUM_BARS; i++) {
          ctx.lineTo(startX + i * step, curveY(i, -1));
        }
        ctx.lineTo(startX + waveW, cy);
        ctx.closePath();

        const fillAlpha = 0.06 + kick * 0.14;
        ctx.fillStyle = `rgba(255, 255, 255, ${fillAlpha})`;
        ctx.fill();

        ctx.strokeStyle = `rgba(255, 255, 255, ${0.35 + kick * 0.55})`;
        ctx.lineWidth = 1 + kick * 0.8;
        ctx.shadowColor = `rgba(255, 255, 255, ${0.12 + kick * 0.35})`;
        ctx.shadowBlur = 4 + kick * 18;

        ctx.beginPath();
        for (let i = 0; i < SPECTRUM_BARS; i++) {
          const x = startX + i * step;
          const y = curveY(i, 1);
          if (i === 0) ctx.moveTo(x, y);
          else ctx.lineTo(x, y);
        }
        ctx.stroke();

        ctx.beginPath();
        for (let i = 0; i < SPECTRUM_BARS; i++) {
          const x = startX + i * step;
          const y = curveY(i, -1);
          if (i === 0) ctx.moveTo(x, y);
          else ctx.lineTo(x, y);
        }
        ctx.stroke();

        ctx.shadowBlur = 0;
        ctx.lineWidth = 0.5;
        ctx.strokeStyle = `rgba(255, 255, 255, ${0.12 + kick * 0.2})`;
        ctx.beginPath();
        ctx.moveTo(startX, cy);
        ctx.lineTo(startX + waveW, cy);
        ctx.stroke();

        const barW = waveW / SPECTRUM_BARS;
        for (let i = 0; i < SPECTRUM_BARS; i++) {
          const v = bars[i];
          if (v < 0.04) continue;
          const x = startX + i * barW + barW * 0.35;
          const bh = v * maxH;
          const isBass = i < SPECTRUM_BARS * 0.12;
          const alpha = isBass
            ? 0.2 + v * 0.55 + kick * 0.45
            : 0.08 + v * 0.35;
          ctx.fillStyle = `rgba(255, 255, 255, ${Math.min(1, alpha)})`;
          ctx.fillRect(x, cy - bh, barW * 0.3, bh);
          ctx.fillRect(x, cy, barW * 0.3, bh);
        }

        ctx.restore();
      }

      function detectKick(bass) {
        bassAvg += (bass - bassAvg) * 0.04;
        const now = performance.now();
        const threshold = Math.max(0.12, bassAvg * 1.55 + 0.06);
        const isHit = bass > threshold && bass > bassAvg * 1.25 && now - lastKickTime > 140;

        if (isHit) {
          kickEnvelope = 1;
          lastKickTime = now;
        } else {
          kickEnvelope *= 0.86;
          if (kickEnvelope < 0.005) kickEnvelope = 0;
        }

        return kickEnvelope;
      }

      function drawVisualizer() {
        const w = window.innerWidth;
        const h = window.innerHeight;
        const cx = w / 2;
        const cy = h / 2;
        const waveY = h * 0.78;

        ctx.clearRect(0, 0, w, h);

        const bass = isPlaying ? getBassLevel() : 0;
        const kick = isPlaying ? detectKick(bass) : 0;

        const baseRadius = Math.min(w, h) * 0.12;
        const hitExpand = kick * Math.min(w, h) * 0.14;
        const pulseRadius = baseRadius + hitExpand;

        drawFrequencyWaveform(cx, waveY, w, h, kick);

        if (kick > 0.02) {
          for (let i = 3; i >= 1; i--) {
            const r = pulseRadius * (1 + i * 0.14 * kick);
            const alpha = kick * 0.08 / i;
            ctx.beginPath();
            ctx.arc(cx, cy, r, 0, Math.PI * 2);
            ctx.strokeStyle = `rgba(95, 95, 100, ${alpha})`;
            ctx.lineWidth = 0.5;
            ctx.stroke();
          }
        }

        const lineCount = 24;
        for (let i = 0; i < lineCount; i++) {
          const angle = (i / lineCount) * Math.PI * 2;
          const innerR = pulseRadius * 0.65;
          const outerR = pulseRadius * (1 + kick * 0.35);
          const alpha = kick > 0.02 ? 0.04 + kick * 0.18 : 0.025;
          ctx.beginPath();
          ctx.moveTo(cx + Math.cos(angle) * innerR, cy + Math.sin(angle) * innerR);
          ctx.lineTo(cx + Math.cos(angle) * outerR, cy + Math.sin(angle) * outerR);
          ctx.strokeStyle = `rgba(70, 70, 75, ${alpha})`;
          ctx.lineWidth = 0.5;
          ctx.stroke();
        }

        ctx.beginPath();
        ctx.arc(cx, cy, pulseRadius, 0, Math.PI * 2);
        ctx.strokeStyle = `rgba(110, 110, 115, ${0.12 + kick * 0.55})`;
        ctx.lineWidth = 0.6 + kick * 1.4;
        ctx.stroke();

        if (kick > 0.05) {
          ctx.beginPath();
          ctx.arc(cx, cy, pulseRadius * 0.28, 0, Math.PI * 2);
          ctx.strokeStyle = `rgba(85, 85, 90, ${kick * 0.25})`;
          ctx.lineWidth = 0.5;
          ctx.stroke();
        }

        animationId = requestAnimationFrame(drawVisualizer);
      }

      function startVisualizer() {
        if (animationId) cancelAnimationFrame(animationId);
        drawVisualizer();
      }

      function stopVisualizer() {
        if (animationId) {
          cancelAnimationFrame(animationId);
          animationId = null;
        }
      }

      function updateTimeline() {
        if (!audioElement || isSeeking) return;
        const pct = audioElement.duration ? (audioElement.currentTime / audioElement.duration) * 100 : 0;
        timelineFill.style.width = pct + '%';
        timelineThumb.style.left = pct + '%';
        timeCurrent.textContent = formatTime(audioElement.currentTime);
      }

      function setPlayingUI(playing) {
        isPlaying = playing;
        iconPlay.style.display = playing ? 'none' : 'block';
        iconPause.style.display = playing ? 'block' : 'none';
      }

      function cleanup() {
        stopVisualizer();
        if (sourceNode) {
          try { sourceNode.disconnect(); } catch (_) {}
          sourceNode = null;
        }
        if (audioElement) {
          audioElement.pause();
          audioElement.removeAttribute('src');
          audioElement.load();
        }
        if (objectUrl) {
          URL.revokeObjectURL(objectUrl);
          objectUrl = null;
        }
        kickEnvelope = 0;
        bassAvg = 0;
        lastKickTime = 0;
        if (spectrumBars) spectrumBars.fill(0);
        changeTrack.classList.remove('visible');
        setPlayingUI(false);
      }

      async function loadFile(file) {
        if (!file || !file.type.startsWith('audio/')) {
          showError('выбери аудиофайл');
          return;
        }

        cleanup();

        try {
          await initAudioContext();
        } catch (_) {
          return;
        }

        if (!analyser) setupAnalyser();

        objectUrl = URL.createObjectURL(file);
        audioElement = new Audio();
        audioElement.src = objectUrl;
        audioElement.preload = 'auto';

        audioElement.addEventListener('loadedmetadata', () => {
          timeDuration.textContent = formatTime(audioElement.duration);
        });

        audioElement.addEventListener('timeupdate', updateTimeline);
        audioElement.addEventListener('ended', () => {
          setPlayingUI(false);
        });

        audioElement.addEventListener('error', () => {
          showError('не удалось загрузить файл');
        });

        trackName.textContent = file.name.replace(/\.[^.]+$/, '');
        dropzone.classList.add('hidden');
        player.classList.add('visible');
        changeTrack.classList.add('visible');

        try {
          connectSource();
        } catch (e) {
          if (e.name === 'InvalidStateError') {
            showError('ошибка подключения аудио — попробуй другой файл');
          } else {
            showError('ошибка инициализации плеера');
          }
          return;
        }

        startVisualizer();
        setPlayingUI(false);
      }

      btnPlay.addEventListener('click', async () => {
        if (!audioElement) return;
        try {
          await initAudioContext();
          if (audioContext.state === 'suspended') await audioContext.resume();
          if (isPlaying) {
            audioElement.pause();
            setPlayingUI(false);
          } else {
            await audioElement.play();
            setPlayingUI(true);
            startVisualizer();
          }
        } catch (e) {
          showError('не удалось воспроизвести — попробуй ещё раз');
        }
      });

      timeline.addEventListener('click', (e) => {
        if (!audioElement || !audioElement.duration) return;
        const rect = timeline.getBoundingClientRect();
        const pct = (e.clientX - rect.left) / rect.width;
        audioElement.currentTime = pct * audioElement.duration;
        updateTimeline();
      });

      let seekDrag = false;
      timeline.addEventListener('mousedown', () => { isSeeking = true; seekDrag = true; });
      document.addEventListener('mouseup', () => {
        if (seekDrag) { isSeeking = false; seekDrag = false; }
      });

      function goBack() {
        cleanup();
        player.classList.remove('visible');
        dropzone.classList.remove('hidden');
        fileInput.value = '';
        ctx.clearRect(0, 0, canvas.width, canvas.height);
      }

      changeTrack.addEventListener('click', goBack);

      dropzone.addEventListener('dragover', (e) => {
        e.preventDefault();
        dropzone.classList.add('dragover');
      });

      dropzone.addEventListener('dragleave', () => {
        dropzone.classList.remove('dragover');
      });

      dropzone.addEventListener('drop', (e) => {
        e.preventDefault();
        dropzone.classList.remove('dragover');
        const file = e.dataTransfer.files[0];
        if (file) loadFile(file);
      });

      fileInput.addEventListener('change', () => {
        const file = fileInput.files[0];
        if (file) loadFile(file);
      });

      document.addEventListener('visibilitychange', () => {
        if (document.hidden && audioElement && isPlaying) {
          /* keep playing in background */
        }
      });
    })();
  </script>
</body>
</html>
